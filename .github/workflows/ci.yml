name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-linux
          # Pinned rather than windows-latest: that label silently moved
          # to a Visual Studio 2026 image in June 2026, breaking every
          # build here because CMakePresets.json's ci-windows preset
          # (inherited from dev-windows) hardcodes generator "Visual
          # Studio 17 2022" -- a generator string is inherently tied to a
          # specific VS version in CMake, there's no "whatever's newest"
          # option, so tracking "latest" here just means silently
          # breaking again on the next such migration. dev-windows stays
          # VS2022-pinned too since that's what a local dev machine is
          # actually likely to have installed; bump both together,
          # deliberately, if/when moving to VS2026.
          - os: windows-2022
            preset: ci-windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          modules: "qtcharts"
          # aqtinstall pulls ~10 archives straight off the Qt mirror network
          # on every job. When download.qt.io is unreachable it falls back to
          # community mirrors, and those fail in ways nothing here controls --
          # a packaging run died on ftp2.nluug.nl serving a certificate not
          # valid for its own hostname, halfway through, after four other
          # archives had already installed. Caching means only the first job
          # on a given Qt version/module set touches the network at all; the
          # rest, including the packaging jobs that run after `build` in the
          # same tagged run, restore from the cache it populated.
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        # ninja-build: CMake generator used by the ci-linux/ci-windows
        # presets. libtinyxml2-dev + pkg-config: MicroTeX's CMakeLists.txt
        # resolves tinyxml2 via `pkg_check_modules` on non-MSVC platforms
        # (cmake/FetchMicroTeX.cmake pulls MicroTeX in as a submodule of
        # this build, so its dependency has to be satisfied here too).
        # libcups2-dev: MicroTeX's Qt backend requires the Qt6PrintSupport
        # component, which on Linux requires CUPS to be found at configure
        # time -- install-qt-action's binary Qt distribution doesn't bundle
        # it (unlike apt's qt6-base-dev, which pulls it in transitively, so
        # this was never reproduced on a dev machine that already had the
        # apt package installed). Confirmed by installing the exact CI Qt
        # version (6.7.3) locally via aqtinstall and reproducing "Qt6
        # component PrintSupport ... could not be found because dependency
        # Cups could not be found" verbatim.
        run: sudo apt-get update && sudo apt-get install -y ninja-build libtinyxml2-dev pkg-config libcups2-dev

      - name: Install tinyxml2 (vcpkg)
        if: runner.os == 'Windows'
        # MicroTeX's MSVC path resolves tinyxml2 via `find_package(tinyxml2
        # CONFIG REQUIRED)`, i.e. a vcpkg-provided config package -- there
        # is no equivalent of Linux's system libtinyxml2-dev here. vcpkg
        # itself is preinstalled on windows-2022 runners at
        # VCPKG_INSTALLATION_ROOT (confirmed still true after pinning off
        # windows-latest above); the ci-windows preset points its
        # toolchainFile there (CMakePresets.json).
        run: vcpkg install tinyxml2:x64-windows

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Everything below only runs for a `vX.Y.Z` tag push (plan doc's Phase 7
  # "done when": a tagged run produces an installable .exe and a runnable
  # .AppImage). Unverified beyond the ci-linux path, which was exercised
  # locally with the exact same preset/commands (see the plan doc's Phase 7
  # notes) -- the Windows packaging steps here were never run on a real
  # Windows machine.

  # The tag is what the in-app update check compares against: it reads this
  # repo's /releases/latest and diffs `tag_name` numerically against the
  # binary's own mathclav::core::version(), which is generated from
  # project(MathClav VERSION ...) -- not from the tag. Tagging v2.1.0
  # without bumping CMakeLists.txt therefore ships a 2.0.0 binary under a
  # 2.1.0 release, and every user's update check fires forever, offering an
  # update they already have. The Windows installer takes its version from
  # the tag too (mathclav.nsi's APP_VERSION), so the same drift also
  # mislabels the installer. Fail the tagged run before anything is
  # published rather than after.
  #
  # Deliberately gated on *any* tag, not just `refs/tags/v`: every job below
  # keys off the `v` prefix, so pushing a tag named `2.0.0` used to skip the
  # whole release half of this workflow silently -- a green run that
  # published nothing, with no failure anywhere saying why. Matching all
  # tags here turns that into a loud, explained failure.
  verify-version:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag must be vX.Y.Z[-suffix] and match project(MathClav VERSION ...)
        id: check
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $GITHUB_REF_NAME is not of the form vX.Y.Z or vX.Y.Z-suffix -- the packaging and release jobs all match on the leading 'v' and would be skipped, publishing nothing."
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          # Only the X.Y.Z core is compared: a prerelease deliberately ships
          # the same source version as the release it leads up to, so
          # v2.0.0-rc1 is expected to sit on project(... VERSION 2.0.0).
          core_version="${tag_version%%-*}"
          cmake_version="$(sed -n 's/^project(MathClav VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          echo "tag=$tag_version core=$core_version cmake=$cmake_version"
          if [ -z "$cmake_version" ]; then
            echo "::error::could not parse the version out of CMakeLists.txt"
            exit 1
          fi
          if [ "$core_version" != "$cmake_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project(MathClav VERSION $cmake_version) -- bump CMakeLists.txt and retag"
            exit 1
          fi
          # A suffix marks the release as a prerelease, which is what keeps it
          # out of /releases/latest -- and so invisible to the in-app update
          # check, which is the whole point of tagging one.
          if [ "$core_version" != "$tag_version" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is a prerelease; it will NOT be offered by the in-app update check"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  package-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          modules: "qtcharts"
          # aqtinstall pulls ~10 archives straight off the Qt mirror network
          # on every job. When download.qt.io is unreachable it falls back to
          # community mirrors, and those fail in ways nothing here controls --
          # a packaging run died on ftp2.nluug.nl serving a certificate not
          # valid for its own hostname, halfway through, after four other
          # archives had already installed. Caching means only the first job
          # on a given Qt version/module set touches the network at all; the
          # rest, including the packaging jobs that run after `build` in the
          # same tagged run, restore from the cache it populated.
          cache: true

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libtinyxml2-dev pkg-config fuse libfuse2

      - name: Configure
        run: cmake --preset ci-linux

      - name: Build
        run: cmake --build --preset ci-linux

      - name: Build AppImage
        # VERSION is read by linuxdeploy to version-suffix the filename, so
        # the release asset is MathClav-2.0.0-x86_64.AppImage rather than a
        # every-release-identical MathClav-x86_64.AppImage.
        # The "v" is stripped to match the installer, which versions itself
        # from the same tag via mathclav.nsi's APP_VERSION.
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          packaging/linux/build-appimage.sh build/ci-linux dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/*.AppImage

  package-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-version
    # Pinned for the same reason as the build matrix above: this job also
    # configures with the VS2022-generator ci-windows preset.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          modules: "qtcharts"
          # aqtinstall pulls ~10 archives straight off the Qt mirror network
          # on every job. When download.qt.io is unreachable it falls back to
          # community mirrors, and those fail in ways nothing here controls --
          # a packaging run died on ftp2.nluug.nl serving a certificate not
          # valid for its own hostname, halfway through, after four other
          # archives had already installed. Caching means only the first job
          # on a given Qt version/module set touches the network at all; the
          # rest, including the packaging jobs that run after `build` in the
          # same tagged run, restore from the cache it populated.
          cache: true

      - name: Install tinyxml2 (vcpkg)
        run: vcpkg install tinyxml2:x64-windows

      - name: Configure
        run: cmake --preset ci-windows

      - name: Build
        run: cmake --build --preset ci-windows --config RelWithDebInfo

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        working-directory: packaging/windows
        # No separate `cmake --install` staging step: app/CMakeLists.txt's
        # POST_BUILD steps already deposit MathClav.exe + MicroTeX's res/ +
        # (via windeployqt) every Qt DLL/plugin side by side in the build
        # tree, exactly what the installer needs -- `cmake --install` would
        # only copy the files covered by an install() rule, missing the
        # windeployqt-added DLLs entirely. ci-windows uses a multi-config
        # (Visual Studio) generator, so the actual output directory is
        # config-named, not just app/.
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $staging = "$env:GITHUB_WORKSPACE\build\ci-windows\app\RelWithDebInfo"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DSTAGING_DIR=$staging" "/DAPP_VERSION=$version" mathclav.nsi

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: packaging/windows/MathClav-*-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # verify-version is already an indirect dependency via the packaging
    # jobs; it's named explicitly because a job can only read the outputs of
    # jobs it lists in `needs`.
    needs: [verify-version, package-linux, package-windows]
    runs-on: ubuntu-latest
    # Creating the release is a write to repository contents, and the
    # default GITHUB_TOKEN is read-only on repos created since Feb 2023 --
    # without this the job fails at the publish step with a 403, after both
    # packaging jobs have already succeeded.
    permissions:
      contents: write
    steps:
      # No `name`/`artifact-ids`: every artifact is downloaded, each into its
      # own artifacts/<name>/ subdirectory, which is what the globs below
      # expect. (v5's breaking path change only affected single downloads by
      # ID, not this every-artifact form.)
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          # Never a draft: the in-app update check reads /releases/latest,
          # which skips drafts entirely. Prerelease tracks the tag's suffix
          # (verify-version derives it), and /releases/latest skips those too
          # -- so a vX.Y.Z-rc1 build is published and downloadable, but is not
          # pushed at existing users, which is the point of tagging one.
          draft: false
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/linux-appimage/*.AppImage
            artifacts/windows-installer/*.exe
